name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # The web build and dev server use demo-data/ files, such as its
      # recommendation policy, over the tracked data/ copies.
      BROWSER_DATA_SOURCE: demo
    strategy:
      fail-fast: false
      matrix:
        # The declared minimum from package.json engines, and the current LTS.
        node-version: ['22.18.0', 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 9.15.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Licensed and league data stay local, so CI builds and tests against demo-data/.
      - name: Check PR size against its event base and head
        if: github.event_name == 'pull_request'
        run: pnpm check:pr-size
      - run: pnpm data:demo:install
      - run: pnpm data:demo:check
      - run: pnpm audit:security
      - run: python3 -m unittest discover -s .agents/skills/verify-fantasy-draft-assistant/helpers -p 'test_*.py'
      - run: pnpm verify
      - name: Check the built site for FantasyPros and league data
        run: pnpm data:demo:check web-app/dist
      - name: Assert web static-output policy
        run: pnpm --filter scripts measure:web-bundle
      - name: Install Chromium for the browser gate
        run: pnpm --filter scripts exec playwright install --with-deps chromium
      - name: Browser gate (visual fixtures, narrow readiness, draft flow)
        run: pnpm browser:gate
      - name: Hosted static demo starts without local storage activation
        run: |
          pnpm build:web:demo
          FLIP_DEMO_OUTPUT="${RUNNER_TEMP}/fda-hosted-demo" pnpm --filter scripts exec tsx --conditions=@fantasy-draft/source ../scripts/persistence/flip-demo.mjs
